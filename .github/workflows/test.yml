name: test

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobsearch_test
          POSTGRES_PASSWORD: jobsearch_test
          POSTGRES_DB: jobsearch_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: apply migrations
        run: |
          for f in sql/*.sql; do
            psql "$TEST_DATABASE_URL" -f "$f"
          done
        env:
          TEST_DATABASE_URL: postgres://jobsearch_test:jobsearch_test@localhost:5433/jobsearch_test

      - name: test
        run: go test ./...
        env:
          TEST_DATABASE_URL: postgres://jobsearch_test:jobsearch_test@localhost:5433/jobsearch_test